<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="A simple, adaptable workspace dashboard." />
    <title>Northstar — Workspace overview</title>
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('northstar-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#020617')
          }
        } catch {
          // Theme preference is optional; the app will fall back to light mode.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
